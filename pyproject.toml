[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-insight"
version = "0.2.0"
description = "Turn audio into a one-line feeling, three mood words and an arc — fully offline, with an optional evidence sheet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
decode = ["av>=12"]
lyrics = ["faster-whisper>=1.0", "av>=12"]
bench = ["pretty_midi>=0.2", "mido>=1.3", "librosa>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
music-insight = "music_insight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
