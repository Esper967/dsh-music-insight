[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-insight"
version = "0.1.0"
description = "Turn audio into an LLM-readable evidence pack: measurements, figures, and a factual report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
decode = ["av>=12"]
lyrics = ["faster-whisper>=1.0", "av>=12"]
dev = ["pytest>=8"]

[project.scripts]
music-insight = "music_insight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
